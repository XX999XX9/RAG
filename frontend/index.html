<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能学习问答助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/marked.min.js"></script>
    <script src="/static/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e9ecef;
            --bg-sidebar: #1f2937;
            --bg-sidebar-hover: #374151;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --text-sidebar: #e5e7eb;
            --text-sidebar-muted: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-secondary: #6366f1;
            --border-color: #e5e7eb;
            --border-sidebar: #374151;
            --user-bg: #3b82f6;
            --assistant-bg: #f3f4f6;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .sidebar-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-sidebar);
        }

        .logo {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-sidebar);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.875rem;
        }

        

        .sidebar-nav {
            display: flex;
            gap: 0.25rem;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-sidebar);
        }

        .nav-item {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 0.375rem;
            background: transparent;
            color: var(--text-sidebar-muted);
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            background-color: var(--bg-sidebar-hover);
            color: var(--text-sidebar);
        }

        .nav-item:hover {
            background-color: var(--bg-sidebar-hover);
        }

        /* Chat History */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .chat-item {
            padding: 0.625rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-item:hover {
            background-color: var(--bg-sidebar-hover);
        }

        .chat-item.active {
            background-color: var(--bg-sidebar-hover);
        }

        .chat-item.active .chat-preview {
            color: var(--text-sidebar);
        }

        

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-title {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-sidebar);
            margin-bottom: 0.125rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-preview {
            font-size: 0.75rem;
            color: var(--text-sidebar-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-time {
            font-size: 0.6875rem;
            color: var(--text-sidebar-muted);
            flex-shrink: 0;
        }

        .chat-delete {
            opacity: 0;
            color: var(--error-color);
            padding: 0.25rem;
            border-radius: 0.25rem;
            transition: all 0.2s ease;
        }

        .chat-item:hover .chat-delete {
            opacity: 1;
        }

        .chat-delete:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .current-chat-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--bg-tertiary);
        }

        /* Chat View */
        #chatView {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            min-height: 0;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .message:last-child {
            margin-bottom: 0;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .message.user .message-avatar {
            background-color: #1a1a1a;
            color: white;
        }

        .message.assistant .message-avatar {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .message-content {
            flex: 1;
            max-width: 70%;
        }

        .message.user .message-content {
            margin-left: auto;
        }

        .message-bubble {
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            line-height: 1.6;
        }

        .message.user .message-bubble {
            background-color: #1a1a1a;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant .message-bubble {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-bottom-left-radius: 0.25rem;
        }

        .message.assistant .message-bubble p {
            margin: 0 0 0.5rem 0;
        }
        .message.assistant .message-bubble p:last-child {
            margin-bottom: 0;
        }
        .message.assistant .message-bubble ul,
        .message.assistant .message-bubble ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        .message.assistant .message-bubble li {
            margin-bottom: 0.25rem;
        }
        .message.assistant .message-bubble code {
            background-color: var(--bg-tertiary);
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .message.assistant .message-bubble pre {
            background-color: var(--bg-tertiary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .message.assistant .message-bubble pre code {
            background: none;
            padding: 0;
        }
        .message.assistant .message-bubble strong {
            font-weight: 600;
        }
        .message.assistant .message-bubble em {
            font-style: italic;
        }
        .message.assistant .message-bubble blockquote {
            border-left: 3px solid var(--border-color);
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: var(--text-secondary);
        }
        .message.assistant .message-bubble h1,
        .message.assistant .message-bubble h2,
        .message.assistant .message-bubble h3 {
            font-weight: 600;
            margin: 0.75rem 0 0.375rem 0;
        }
        .message.assistant .message-bubble h1 { font-size: 1.25rem; }
        .message.assistant .message-bubble h2 { font-size: 1.125rem; }
        .message.assistant .message-bubble h3 { font-size: 1rem; }

        

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            font-size: 0.875rem;
            text-align: center;
            max-width: 300px;
        }

        /* Input Area */
        .input-container {
            padding: 1.25rem 2rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            flex-shrink: 0;
        }

        .input-actions {
            display: flex;
            gap: 0.5rem;
            max-width: 800px;
            margin: 0 auto 1rem;
        }

        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            font-size: 0.9375rem;
            background-color: var(--bg-secondary);
            transition: all 0.2s ease;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            overflow-y: auto;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: var(--bg-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            padding: 0.875rem 1.5rem;
            border-radius: 1rem;
            background-color: #1a1a1a;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .send-btn:hover {
            background-color: #2a2a2a;
        }

        .send-btn:disabled {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* File Management View 相关样式已随功能迁移至 admin.html */

        /* Loading Animation */
        .loading {
            display: inline-flex;
            gap: 0.25rem;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
            animation: loading 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loading {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-success {
            background-color: rgba(16, 185, 129, 0.9);
            color: white;
        }

        .toast-error {
            background-color: rgba(239, 68, 68, 0.9);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
            }

            .message-content {
                max-width: 90%;
            }

            .messages-container {
                padding: 1rem;
            }

            .input-container {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">R</div>
                <span>学习问答助手</span>
            </div>
        </div>

        <div class="sidebar-nav">
            <button class="nav-item active" id="navChats">
                对话
            </button>
            <a class="nav-item" id="navAdmin" href="/admin" style="text-decoration: none;">
                管理员入口
            </a>
        </div>

        <div class="chat-history" id="chatHistory">
            <!-- Chat history will be populated dynamically -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Chat View -->
        <div id="chatView">
            <header>
            </header>

            <div class="chat-view">
                <div class="messages-container" id="messagesContainer">
                    <!-- Messages will be populated dynamically -->
                </div>

                <div class="input-container">
                    <div class="input-actions">
                        <button class="btn btn-secondary" onclick="createNewChat()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14"/>
                                <path d="M5 12h14"/>
                            </svg>
                            新对话
                        </button>
                        <button class="btn btn-secondary" onclick="clearCurrentChat()">
                            清空对话
                        </button>
                    </div>
                    <div class="input-wrapper">
                        <textarea 
                            class="input-field" 
                            id="inputField" 
                            placeholder="输入你的问题..."
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <span>发送</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m22 11.08-10.947-6.961a1.25 1.25 0 0 0-1.796 0L2 11.08v8.135a1.25 1.25 0 0 0 1.796 1.066l8.25-5.071 8.25 5.071a1.25 1.25 0 0 0 1.796-1.066V11.08Z"/>
                                <path d="m7.75 4.03 9.5 5.81"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- File Management View 已迁移至管理员页面 /admin -->
    </main>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script>
        // API 配置
        const API_BASE = '/api';
        let chats = [];
        let currentChatId = null;

        // 可选 API Key：首次通过 URL ?key=xxx 传入后缓存到 localStorage（与后端 .env 中 RAG_API_KEY 对应）
        let API_KEY = localStorage.getItem('apiKey') || '';
        {
            const urlKey = new URLSearchParams(location.search).get('key');
            if (urlKey) {
                API_KEY = urlKey;
                localStorage.setItem('apiKey', urlKey);
            }
        }

        function apiUrl(path) {
            if (!API_KEY) return `${API_BASE}${path}`;
            const sep = path.includes('?') ? '&' : '?';
            return `${API_BASE}${path}${sep}api_key=${encodeURIComponent(API_KEY)}`;
        }

        function apiHeaders() {
            return API_KEY ? { 'X-API-Key': API_KEY } : {};
        }

        function wsUrl() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const key = API_KEY ? `?api_key=${encodeURIComponent(API_KEY)}` : '';
            return `${proto}://${location.host}/api/chat/ws${key}`;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadChats();
            bindDelegatedEvents();
        });

        // 事件委托：避免把动态数据拼进内联 onclick（防 XSS / 语法破坏）
        function bindDelegatedEvents() {
            document.getElementById('chatHistory').addEventListener('click', (e) => {
                const del = e.target.closest('.chat-delete');
                if (del) {
                    e.stopPropagation();
                    deleteChat(del.dataset.deleteId);
                    return;
                }
                const item = e.target.closest('.chat-item');
                if (item) selectChat(item.dataset.chatId);
            });
        }

        // 加载对话列表
        async function loadChats() {
            try {
                const storedChats = localStorage.getItem('chats');
                if (storedChats) {
                    chats = JSON.parse(storedChats);
                } else {
                    // 创建默认对话
                    chats = [{
                        id: Date.now().toString(),
                        title: '新对话',
                        messages: [],
                        createdAt: new Date().toISOString()
                    }];
                    saveChats();
                }
                renderChatHistory();
                if (chats.length > 0) {
                    selectChat(chats[0].id);
                }
            } catch (error) {
                console.error('Failed to load chats:', error);
            }
        }

        // 保存对话列表
        function saveChats() {
            localStorage.setItem('chats', JSON.stringify(chats));
        }

        // 创建新对话
        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                sessionId: 'chat-' + Date.now().toString() + '-' + Math.random().toString(36).slice(2, 10),
                title: '新对话',
                messages: [],
                createdAt: new Date().toISOString()
            };
            chats.unshift(newChat);
            saveChats();
            renderChatHistory();
            selectChat(newChat.id);
            document.getElementById('inputField').focus();
        }

        // 渲染对话历史
        function renderChatHistory() {
            const container = document.getElementById('chatHistory');
            
            if (chats.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 2rem;">暂无对话</div>';
                return;
            }

            container.innerHTML = chats.map(chat => {
                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : null;
                const preview = lastMsg
                    ? lastMsg.content.substring(0, 30) + (lastMsg.content.length > 30 ? '...' : '')
                    : '暂无消息';
                const time = new Date(chat.createdAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

                return `
                    <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" data-chat-id="${escapeHtml(chat.id)}">
                        <div class="chat-info">
                            <div class="chat-title">${escapeHtml(chat.title)}</div>
                            <div class="chat-preview">${escapeHtml(preview)}</div>
                        </div>
                        <div class="chat-time">${escapeHtml(time)}</div>
                        <span class="chat-delete" data-delete-id="${escapeHtml(chat.id)}">✕</span>
                    </div>
                `;
            }).join('');
        }

        // 选择对话
        function selectChat(chatId) {
            currentChatId = chatId;
            renderChatHistory();
            
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                renderMessages(chat.messages, true); // true = 滚动到底部
            }
        }

        // 删除对话
        function deleteChat(chatId) {
            if (chats.length === 1) {
                showToast('至少保留一个对话', 'error');
                return;
            }
            
            chats = chats.filter(c => c.id !== chatId);
            saveChats();
            
            if (currentChatId === chatId) {
                currentChatId = chats[0].id;
            }
            
            renderChatHistory();
            selectChat(currentChatId);
            showToast('对话已删除', 'success');
        }

        // 清空当前对话
        function clearCurrentChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = [];
                chat.title = '新对话';
                saveChats();
                renderChatHistory();
                renderMessages([]);
                showToast('对话已清空', 'success');
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('inputField');
            const message = input.value.trim();
            
            if (!message) return;
            
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            // 添加用户消息
            const userMsg = { role: 'user', content: message };
            chat.messages.push(userMsg);
            
            // 更新标题
            if (chat.messages.length === 1) {
                chat.title = message.substring(0, 20) + (message.length > 20 ? '...' : '');
            }
            
            saveChats();
            renderChatHistory();
            renderMessages(chat.messages, true); // 发送消息后滚动到底部
            input.value = '';
            
            // 禁用发送按钮
            document.getElementById('sendBtn').disabled = true;
            
            // 添加加载状态
            const loadingMsg = { role: 'assistant', content: '', loading: true };
            chat.messages.push(loadingMsg);
            renderMessages(chat.messages, true); // 添加加载状态后也滚动到底部
            
            try {
                // 使用 WebSocket 流式响应（携带会话 ID，保证服务端能取到多轮历史）
                const ws = new WebSocket(wsUrl());

                ws.onopen = () => {
                    ws.send(JSON.stringify({ message, session_id: chat.sessionId }));
                };
                
                let assistantMsgIndex = chat.messages.length - 1;
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'chunk') {
                        chat.messages[assistantMsgIndex].content += data.content;
                        chat.messages[assistantMsgIndex].loading = false;
                        saveChats();
                        renderMessages(chat.messages, true); // 流式响应时滚动到底部
                    } else if (data.type === 'done') {
                        ws.close();
                        document.getElementById('sendBtn').disabled = false;
                    } else if (data.type === 'error') {
                        chat.messages[assistantMsgIndex].content = '抱歉，服务暂时不可用。';
                        chat.messages[assistantMsgIndex].loading = false;
                        saveChats();
                        renderMessages(chat.messages, true); // 错误时也滚动到底部
                        ws.close();
                        document.getElementById('sendBtn').disabled = false;
                    }
                };
                
                ws.onerror = () => {
                    fallbackHTTPRequest(message, chat, chat.messages.length - 1);
                };
                
                ws.onclose = () => {
                    document.getElementById('sendBtn').disabled = false;
                };
            } catch (error) {
                fallbackHTTPRequest(message, chat, chat.messages.length - 1);
            }
        }

        // 回退到 HTTP 请求
        async function fallbackHTTPRequest(message, chat, index) {
            try {
                const response = await fetch(apiUrl('/chat'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...apiHeaders() },
                    body: JSON.stringify({ message, session_id: chat.sessionId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    chat.messages[index].content = data.response;
                    chat.messages[index].loading = false;
                } else {
                    chat.messages[index].content = '抱歉，服务暂时不可用。';
                    chat.messages[index].loading = false;
                }
            } catch (error) {
                chat.messages[index].content = '抱歉，服务暂时不可用。';
                chat.messages[index].loading = false;
            } finally {
                saveChats();
                renderMessages(chat.messages, true); // HTTP回退响应后也滚动到底部
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // 渲染消息
        function renderMessages(messages, shouldScroll = false) {
            const container = document.getElementById('messagesContainer');
            
            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📚</div>
                        <div class="empty-title">开始学习</div>
                        <div class="empty-desc">输入你想学习的问题，我会根据知识库内容为你解答</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = messages.map((msg, index) => {
                const isUser = msg.role === 'user';
                const hasLoading = msg.loading;
                
                return `
                    <div class="message ${msg.role}">
                        <div class="message-avatar">
                            ${isUser ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`}
                        </div>
                        <div class="message-content">
                            <div class="message-bubble">
                                ${hasLoading ? `
                                    <div class="loading">
                                        <span class="loading-dot"></span>
                                        <span class="loading-dot"></span>
                                        <span class="loading-dot"></span>
                                    </div>
                                ` : renderMarkdown(msg.content)}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // 仅在需要时滚动到底部
            if (shouldScroll) {
                setTimeout(() => {
                    var lastMsg = container.lastElementChild;
                    if (lastMsg) {
                        lastMsg.scrollIntoView({ behavior: 'auto', block: 'end' });
                    }
                }, 50);
            }
        }

        // 键盘事件
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 显示提示
        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                ${type === 'success' ? '✓' : '✕'}
                <span>${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // HTML 转义（覆盖引号，可安全用于属性与文本上下文）
        function escapeHtml(text) {
            return String(text ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        // Markdown 渲染（经 DOMPurify 消毒，防止文档内容注入脚本）
        function renderMarkdown(text) {
            if (!text) return '';
            try {
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });
                return DOMPurify.sanitize(marked.parse(text));
            } catch (e) {
                return escapeHtml(text);
            }
        }
    </script>
</body>
</html>
